<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="280" height="200">
  <defs>
    <filter id="badgeShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Fundo retangular branco com borda suave -->
  <rect x="4" y="4" width="272" height="192" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#badgeShadow)" />

  <!-- Símbolo Institucional Centralizado -->
  <g transform="translate(84, 20)">
    <rect x="0" y="38" width="20" height="42" rx="3" fill="#28B78D" />
    <rect x="26" y="10" width="22" height="70" rx="3" fill="#243743" />
    <rect x="54" y="26" width="20" height="54" rx="3" fill="#A0A9AE" />
    <rect x="80" y="44" width="18" height="36" rx="3" fill="#28B78D" />
  </g>

  <!-- Tipografia BMRT -->
  <text x="140" y="135" text-anchor="middle" font-family="'Open Sans', 'Segoe UI', 'Roboto', 'Noto Sans', sans-serif" font-weight="900" font-size="36" fill="#008037" letter-spacing="3px">BMRT</text>

  <!-- Sigla SBCAL -->
  <text x="140" y="165" text-anchor="middle" font-family="'Open Sans', 'Segoe UI', 'Roboto', 'Noto Sans', sans-serif" font-weight="800" font-size="18" fill="#47966F" letter-spacing="5px">SBCAL</text>
</svg>