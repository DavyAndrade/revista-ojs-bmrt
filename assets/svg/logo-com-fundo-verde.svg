<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 180" width="570" height="180">
  <defs>
    <!-- Gradiente oficial do Banner Periodikos -->
    <linearGradient id="bgBannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33995F" />
      <stop offset="50%" stop-color="#28B78D" />
      <stop offset="100%" stop-color="#006B46" />
    </linearGradient>
    <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#198754" />
      <stop offset="100%" stop-color="#008037" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <style>
    .brand-title { font-family: 'Open Sans', 'Montserrat', sans-serif; font-weight: 800; font-size: 38px; fill: #243743; letter-spacing: 2px; }
    .brand-sub { font-family: 'Open Sans', 'Montserrat', sans-serif; font-weight: 700; font-size: 14px; fill: #008037; letter-spacing: 3.5px; }
    .brand-full { font-family: 'Open Sans', sans-serif; font-weight: 500; font-size: 11.5px; fill: #5B6972; letter-spacing: 0.2px; }
  </style>

  <!-- 1. Fundo Verde Geometrico do Banner Superior -->
  <rect x="0" y="0" width="570" height="180" fill="url(#bgBannerGrad)" />
  <polygon points="0,0 280,0 140,180" fill="#ffffff" opacity="0.08" />
  <polygon points="140,180 280,0 420,180" fill="#004D31" opacity="0.25" />
  <polygon points="280,0 570,0 420,180" fill="#ffffff" opacity="0.06" />

  <!-- 2. Badge / Retangulo Branco Interno de Destaque -->
  <g filter="url(#badgeShadow)">
    <rect x="45" y="16" width="480" height="148" rx="8" fill="#FFFFFF" stroke="#EBF5EF" stroke-width="1.5" />
  </g>

  <!-- 3. Icone Biocientifico / Animal Model Helix -->
  <g transform="translate(68, 30)">
    <circle cx="60" cy="60" r="50" fill="#EBF5EF" />
    <path d="M60,18 C82,18 100,36 100,58 C100,80 82,98 60,98 C50,98 42,94 36,88 C46,88 58,80 63,70 C68,60 68,48 60,40 C53,33 43,32 34,35 C40,24 49,18 60,18 Z" fill="url(#symbolGrad)" />
    <path d="M38,44 C43,54 50,62 60,65 C67,68 75,65 78,58 C81,51 78,43 71,40 C64,36 56,38 49,43 Z" fill="#243743" opacity="0.85" />
    <circle cx="48" cy="74" r="8" fill="#28B78D" />
    <circle cx="72" cy="44" r="6" fill="#008037" />
    <circle cx="36" cy="56" r="4" fill="#33995F" />
  </g>

  <!-- 4. Textos da Marca -->
  <g transform="translate(205, 38)">
    <text x="0" y="38" class="brand-title">BMRT</text>
    <text x="2" y="60" class="brand-sub">SBCAL</text>
    <line x1="2" y1="72" x2="295" y2="72" stroke="#66B387" stroke-width="2" stroke-linecap="round" />
    <text x="2" y="93" class="brand-full">Biological Models Research &amp; Technology</text>
  </g>
</svg>
